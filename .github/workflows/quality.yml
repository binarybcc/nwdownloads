name: Code Quality

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  quality:
    name: Quality Checks (PHPStan & PHPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c .phpstan.neon --memory-limit=512M --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs web/ --standard=PSR12 --extensions=php --report=summary --runtime-set ignore_warnings_on_exit 1

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testsuite Unit
